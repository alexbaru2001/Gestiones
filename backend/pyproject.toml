[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gestiones-backend"
version = "0.1.0"
description = "Backend hexagonal para Gestiones"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "requests>=2.31",
  "yfinance>=0.2.55"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27"
]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["Personal_finanzas*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
