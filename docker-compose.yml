services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      GESTIONES_CORS_ORIGINS: ${GESTIONES_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      GESTIONES_OBJECTIVES_PATH: ${GESTIONES_OBJECTIVES_PATH:-/app/Personal_finanzas/Data/objetivos_vista.json}
    ports:
      - "8000:8000"
    volumes:
      - ./Personal_finanzas/Data:/app/Personal_finanzas/Data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    command: pytest -q
    profiles:
      - test
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
