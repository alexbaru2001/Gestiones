services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GESTIONES_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: pytest -q
    profiles:
      - test
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
