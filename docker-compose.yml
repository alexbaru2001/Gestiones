services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: pytest -q
    profiles:
      - test
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
